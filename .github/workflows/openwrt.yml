name: OpenWrt package build

on:
  push:
  workflow_dispatch:

jobs:
  build-openwrt:
    name: Build ${{ matrix.revision }} packages for ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
        revision:
          - openwrt-25.12
          - SNAPSHOT
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.revision }}
          PACKAGES: mimic
          V: s
      - name: Collect apk packages
        run: |
          mkdir -p apk
          cp bin/packages/*/action/*.apk apk/ 2>/dev/null || true
          cp bin/targets/*/*/packages/kmod-mimic*.apk apk/ 2>/dev/null || true
      - name: Store packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-${{ matrix.revision }}
          path: apk/*.apk
